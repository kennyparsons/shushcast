<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Shush Cast</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Shush Cast">
<meta property="og:description" content="Low-latency TV audio stream on your phone">
<meta property="og:image" content="/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shush Cast">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1017">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1017; color: #eef2f7; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }
  .card {
    width: 100%; max-width: 420px; background: #161b26; border: 1px solid #262e3f;
    border-radius: 18px; padding: 24px; box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.02em; }
  .sub { color: #8c98ad; font-size: 14px; margin-bottom: 20px; }
  .status {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    background: #10141d; border-radius: 12px; font-size: 14px; margin-bottom: 18px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; flex-shrink: 0; }
  .dot.live { background: #34d399; box-shadow: 0 0 12px #34d399; }
  .dot.err { background: #f87171; }
  button.primary {
    width: 100%; padding: 16px; border: 0; border-radius: 14px; font-size: 17px;
    font-weight: 600; cursor: pointer; background: #34d399; color: #062118;
    transition: transform .08s ease, opacity .15s ease;
  }
  button.primary.stop { background: #ef4444; color: #fff; }
  button.primary:active { transform: scale(.98); }
  .group { margin-top: 20px; }
  label { display: flex; justify-content: space-between; font-size: 14px; color: #b5c0d4; margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg button {
    padding: 10px 6px; border-radius: 10px; border: 1px solid #2a3347;
    background: #10141d; color: #b5c0d4; font-size: 12px; cursor: pointer; line-height: 1.3;
  }
  .seg button.active { background: #1e3a34; border-color: #34d399; color: #6ee7b7; font-weight: 600; }
  .hint { margin-top: 8px; font-size: 12px; color: #7e8ba3; }
  .meter-bg { height: 8px; background: #10141d; border-radius: 99px; overflow: hidden; margin-top: 18px; }
  .meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#34d399,#fbbf24); transition: width 60ms linear; }
  .meta { margin-top: 14px; font-size: 12px; color: #6f7c93; display: flex; justify-content: space-between; }
  .dbg { margin-top: 8px; font-size: 11px; color: #475569; }
</style>
</head>
<body>
<div class="card">
  <h1>Shush Cast</h1>
  <div class="sub">100% TV audio stream &middot; use your device volume buttons</div>

  <div class="status">
    <div id="dot" class="dot"></div>
    <div id="statusText">Tap Start Listening to connect</div>
  </div>

  <button id="toggleBtn" class="primary">Start Listening</button>
  <audio id="silence" loop playsinline preload="auto" src="/silence.wav" style="display:none"></audio>

  <div class="group">
    <label><span>Lip-Sync Delay</span><span id="bufLabel">50 ms</span></label>
    <div class="seg">
      <button data-ms="25">Tight Sync<br>(25 ms)</button>
      <button data-ms="50" class="active">Low<br>(50 ms)</button>
      <button data-ms="120">Smooth<br>(120 ms)</button>
    </div>
    <div class="hint">Lower = tighter lip-sync with TV. Raise only if Wi-Fi crackles.</div>
  </div>

  <div class="meter-bg"><div id="meter" class="meter-fill"></div></div>
  <div class="meta">
    <span id="fmt">48 kHz Stereo PCM</span>
    <span id="clients">Listeners: -</span>
  </div>
  <div id="dbg" class="dbg"></div>
</div>

<script>
(() => {
  const toggleBtn = document.getElementById('toggleBtn');
  const silenceEl = document.getElementById('silence');
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const bufLabel = document.getElementById('bufLabel');
  const meter = document.getElementById('meter');
  const clientsEl = document.getElementById('clients');
  const fmtEl = document.getElementById('fmt');
  const dbgEl = document.getElementById('dbg');
  const segBtns = Array.from(document.querySelectorAll('.seg button'));

  let ws = null;
  let ctx = null;
  let running = false;
  let sampleRate = 48000;
  let channels = 2;
  let nextPlayTime = 0;
  let targetDelaySec = 0.05;
  let peakLevel = 0;
  let meterTimer = null;
  let pingTimer = null;
  let pingInFlight = false;

  if (window.isSecureContext && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  function setStatus(text, mode) {
    statusText.textContent = text;
    dot.className = 'dot' + (mode ? ' ' + mode : '');
  }

  function stopPingPoll() {
    if (pingTimer) {
      clearInterval(pingTimer);
      pingTimer = null;
    }
  }

  function startPingPoll() {
    if (pingTimer || running) return;
    pingTimer = setInterval(() => {
      if (running) {
        stopPingPoll();
        return;
      }
      checkServer();
    }, 3000);
  }

  async function checkServer() {
    if (pingInFlight) return;
    pingInFlight = true;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 1500);
    try {
      const res = await fetch('/ping', { cache: 'no-store', signal: ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      stopPingPoll();
      if (!running) {
        if (typeof data.clients === 'number') {
          clientsEl.textContent = 'Listeners: ' + data.clients;
        }
        if (data.capturing === false) {
          setStatus('Connected · TV capture paused', '');
        } else {
          setStatus('TV server ready · Tap Start Listening', '');
        }
      }
    } catch (_) {
      if (!running) {
        setStatus('You need to start the Shush Cast server on your TV first.', 'err');
        startPingPoll();
      }
    } finally {
      clearTimeout(timer);
      pingInFlight = false;
    }
  }

  segBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      segBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const ms = Number(btn.dataset.ms);
      targetDelaySec = ms / 1000;
      bufLabel.textContent = ms + ' ms';
      if (ctx) nextPlayTime = ctx.currentTime + targetDelaySec;
    });
  });

  function teardownConnection() {
    running = false;
    toggleBtn.textContent = 'Start Listening';
    toggleBtn.classList.remove('stop');
    if (meterTimer) { clearInterval(meterTimer); meterTimer = null; }
    if (ws) { try { ws.close(); } catch (_) {} ws = null; }
    try { silenceEl.pause(); silenceEl.currentTime = 0; } catch (_) {}
    if (ctx) { try { ctx.close(); } catch (_) {} ctx = null; }
    meter.style.width = '0%';
  }

  function stop() {
    teardownConnection();
    setStatus('Stopped', '');
  }

  function start() {
    stopPingPoll();
    let sessInfo = 'no-audioSession';
    try {
      if ('audioSession' in navigator) {
        navigator.audioSession.type = 'playback';
        sessInfo = 'session=' + navigator.audioSession.type;
      }
    } catch (e) {
      sessInfo = 'sessionErr=' + e.message;
    }

    silenceEl.volume = 1.0;
    const p = silenceEl.play();
    if (p && p.then) {
      p.then(() => {
        dbgEl.textContent = sessInfo + ' · mediaChan=ok';
      }).catch(e => {
        dbgEl.textContent = sessInfo + ' · mediaChanErr=' + e.message;
      });
    } else {
      dbgEl.textContent = sessInfo;
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    ctx = new AudioCtx({ sampleRate: 48000, latencyHint: 'interactive' });
    if (ctx.state === 'suspended') ctx.resume();

    running = true;
    nextPlayTime = 0;

    toggleBtn.textContent = 'Stop Listening';
    toggleBtn.classList.add('stop');
    setStatus('Connecting...', '');

    const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + location.host + '/ws');
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => setStatus('Connected · Waiting for TV audio...', 'live');
    ws.onclose = () => {
      if (running) {
        teardownConnection();
        setStatus('Disconnected — checking TV server...', 'err');
        checkServer();
      }
    };
    ws.onerror = () => {
      if (running) setStatus('Connection error', 'err');
    };

    ws.onmessage = (ev) => {
      if (!running || !ctx) return;
      if (typeof ev.data === 'string') {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.sampleRate) sampleRate = msg.sampleRate;
          if (msg.channels) channels = msg.channels;
          if (typeof msg.clients === 'number') clientsEl.textContent = 'Listeners: ' + msg.clients;
          fmtEl.textContent = (sampleRate / 1000) + ' kHz ' + (channels === 2 ? 'Stereo' : 'Mono') + ' PCM';
          if (msg.capturing === false) {
            setStatus('Connected · TV capture paused', '');
          } else if (msg.capturing === true) {
            setStatus('Live · 100% TV audio', 'live');
          }
        } catch (_) {}
        return;
      }

      const pcm = new Int16Array(ev.data);
      const frameCount = (pcm.length / channels) | 0;
      if (frameCount <= 0) return;

      const audioBuf = ctx.createBuffer(channels, frameCount, sampleRate);
      const ch0 = audioBuf.getChannelData(0);
      const ch1 = channels > 1 ? audioBuf.getChannelData(1) : null;

      let maxAbs = 0;
      for (let i = 0, j = 0; i < frameCount; i++) {
        const s0 = pcm[j++] / 32768.0;
        ch0[i] = s0;
        const a0 = s0 < 0 ? -s0 : s0;
        if (a0 > maxAbs) maxAbs = a0;
        if (ch1) {
          const s1 = pcm[j++] / 32768.0;
          ch1[i] = s1;
          const a1 = s1 < 0 ? -s1 : s1;
          if (a1 > maxAbs) maxAbs = a1;
        }
      }
      if (maxAbs > peakLevel) peakLevel = maxAbs;

      const now = ctx.currentTime;
      if (nextPlayTime < now || nextPlayTime > now + targetDelaySec + 0.08) {
        nextPlayTime = now + targetDelaySec;
      }
      const src = ctx.createBufferSource();
      src.buffer = audioBuf;
      src.connect(ctx.destination);
      src.start(nextPlayTime);
      nextPlayTime += audioBuf.duration;
    };

    meterTimer = setInterval(() => {
      const pct = Math.min(100, Math.round(peakLevel * 140));
      meter.style.width = pct + '%';
      peakLevel *= 0.45;
    }, 60);
  }

  toggleBtn.addEventListener('click', () => {
    if (running) stop(); else start();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (!running) {
        checkServer();
      } else if (ws && ws.readyState !== WebSocket.OPEN && ws.readyState !== WebSocket.CONNECTING) {
        teardownConnection();
        checkServer();
      }
    }
  });

  checkServer();
})();
</script>
</body>
</html>
